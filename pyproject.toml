[project]
name = "cme-visualizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["network: needs access to cdaw.gsfc.nasa.gov (deselect with -m 'not network')"]
